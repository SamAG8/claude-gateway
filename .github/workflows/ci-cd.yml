name: CI/CD

# Tests run on every PR and every push to main, on GitHub-hosted runners (this
# repo is public, so those minutes are free). The deploy job runs ONLY for a
# push to main, on the self-hosted runner `constralabs-claude-gateway`, which
# lives on the production host itself (constralabs, Vultr — the box that
# serves https://ap.constralabs.ai/llm-gateway/). The deploy is
# /opt/constralabs/bin/deploy-app, the same health-gated, self-rolling-back script
# every stack on that host uses; this workflow adds nothing to it except the
# REVISION stamp and a check that the build answering /health is the commit
# that was pushed. Detail: docs/deployment.md here, and on the box
# /opt/constralabs/docs/OPERATIONS.md and
# /opt/constralabs/docs/stacks/claude-gateway.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # Mocked engine — no real claude CLI, no tokens. The live smoke test is
        # skipped unless RUN_LIVE=1, so it never runs here.
        run: python -m pytest -q

  deploy:
    name: Deploy to production (constralabs)
    needs: test
    # A push to main, or a manual run from main. Never a pull_request: this
    # repo is public and the self-hosted runner must never execute a fork's
    # code.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, constralabs-claude-gateway]
    # `environment:` is what creates the record under
    # github.com/SamAG8/claude-gateway/deployments and marks it success/failure.
    environment:
      name: production
      url: https://ap.constralabs.ai/llm-gateway/health
    # Never let two deploys run at once; queue them instead of overlapping.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      # No actions/checkout: deploy-app.sh owns the source clone at
      # /var/www/claude-gateway/app and resets it to this exact SHA itself.
      # REVISION is a Docker build-arg the stack's Dockerfile writes to
      # /srv/gateway/REVISION, which is what /health reports.
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: REVISION="${SHA::7}" /opt/constralabs/bin/deploy-app claude-gateway "$SHA"

      # Pinned with --resolve to this host's own public address, so a pass
      # proves THIS host served the build, whatever DNS says. The address comes
      # from HOST_PUBLIC_IP in host-facts.env, else the default route's source.
      - name: Verify the build that answers is this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          # DERIVED, never hardcoded. Two migrations in a row shipped a stale
          # literal here, and because a failed public probe reads as 'not
          # serving', it took good deploys down with it.
          . /opt/constralabs/etc/host-facts.env 2>/dev/null || true
          ip="${HOST_PUBLIC_IP:-$(ip -4 route get 1.1.1.1 | awk '{print $7; exit}')}"
          [ -n "$ip" ] || { echo "::error::cannot determine this host's address"; exit 1; }
          body="$(curl -sS --max-time 10 --resolve "ap.constralabs.ai:443:$ip" \
                    https://ap.constralabs.ai/llm-gateway/health)"
          echo "$body"
          python3 - "$body" "${SHA::7}" <<'PY'
          import json, sys
          h, want = json.loads(sys.argv[1]), sys.argv[2]
          assert h.get("status") == "ok", h
          assert h.get("revision") == want, f'serving {h.get("revision")!r}, pushed {want!r}'
          assert h.get("mcp") is True and h.get("pat_auth") is True, h
          PY

      - name: Fail if anything on the host went unhealthy
        run: |
          # Scoped to COMPOSE-MANAGED containers on purpose. deploy-app starts a
          # throwaway ':candidate' container for its own health gate, and other
          # stacks' workflows do the same concurrently. An unscoped sweep sees those
          # while they are still warming up and fails THIS deploy for a problem that
          # belongs to another run - which is what happened on 2026-09-18 when four
          # deploys ran at once and failed each other. Candidates are not
          # compose-managed, so the label filter excludes them without weakening the
          # check. (CDefApp's ci-cd.yml solves this differently, with a before/after
          # snapshot; either approach is fine, an unscoped sweep is not.)
          bad="$(docker ps --filter health=unhealthy \
                            --filter label=com.docker.compose.project \
                            --format '{{.Names}}')"
          [ -z "$bad" ] || { echo "unhealthy containers: $bad"; exit 1; }
